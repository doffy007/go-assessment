basePath: /v1
definitions:
  auth.DtoRegister:
    properties:
      email:
        example: johndoe@mail.com
        type: string
      name:
        example: John Doe
        type: string
      password:
        example: secret123
        type: string
      username:
        example: johndoe
        type: string
    type: object
  auth.DtoRegisterResponse:
    properties:
      user:
        $ref: '#/definitions/user.Public'
    type: object
  auth.DtoSignIn:
    properties:
      password:
        example: secret123
        type: string
      username:
        example: johndoe
        type: string
    type: object
  auth.DtoSignInResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6...
        type: string
    type: object
  comment.CommentResponse:
    properties:
      author:
        $ref: '#/definitions/comment.UserPublic'
      content:
        example: This is a comment
        type: string
      created_at:
        example: "2025-10-04T12:00:00Z"
        type: string
      deleted_at:
        type: string
      id:
        example: 123
        type: integer
      post_id:
        example: 1
        type: integer
      status:
        example: active
        type: string
      updated_at:
        example: "2025-10-04T12:00:00Z"
        type: string
      user_id:
        example: 99
        type: integer
    type: object
  comment.CommentSwagger:
    properties:
      content:
        example: This is my comment
        type: string
      status:
        example: active
        type: string
    type: object
  comment.CommentsResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/comment.CommentResponse'
        type: array
      total:
        example: 100
        type: integer
    type: object
  comment.ErrorResponse:
    properties:
      message:
        example: error message
        type: string
    type: object
  comment.UserPublic:
    properties:
      id:
        example: 99
        type: integer
      name:
        example: John Doe
        type: string
      username:
        example: john_doe
        type: string
    type: object
  post.ErrorResponse:
    properties:
      error:
        example: error message
        type: string
    type: object
  post.PostResponse:
    properties:
      post:
        $ref: '#/definitions/post.PostSwagger'
    type: object
  post.PostSwagger:
    type: object
  post.PostsResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/post.PostSwagger'
        type: array
      total:
        type: integer
    type: object
  post.UnauthorizedResponse:
    properties:
      error:
        example: unauthorized
        type: string
    type: object
  role.AssignRoleRequest:
    properties:
      role:
        type: string
    type: object
  role.ErrorRoleResponse:
    properties:
      error:
        type: string
    type: object
  user.Public:
    properties:
      email:
        type: string
      id:
        example: "0"
        type: string
      name:
        type: string
      username:
        type: string
    type: object
  user.User:
    type: object
host: localhost:8080
info:
  contact: {}
  description: Example REST API with JWT Authentication
  title: REST API Example
  version: "1.0"
paths:
  /admin/users:
    get:
      description: Get list of users with optional filtering
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/user.User'
            type: array
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get list of users
      tags:
      - Admin
  /admin/users/{userId}:
    get:
      description: Get user details by ID, or the logged-in user if ID not provided
      parameters:
      - description: User ID
        in: path
        name: userId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - Admin
  /admin/users/{userId}/assign:
    post:
      description: Assign a specific role (e.g. Writter) to a user by ID
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: integer
      - description: Role to assign
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/role.AssignRoleRequest'
      responses:
        "200":
          description: Role assigned successfully
        "400":
          description: Invalid role
          schema:
            $ref: '#/definitions/role.ErrorRoleResponse'
        "500":
          description: Failed to assign role
          schema:
            $ref: '#/definitions/role.ErrorRoleResponse'
      security:
      - BearerAuth: []
      summary: Assign a role to a user
      tags:
      - Admin
  /admin/users/{userId}/unassign:
    post:
      description: Remove any assigned role from a user by ID
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: integer
      responses:
        "200":
          description: Role unassigned successfully
        "500":
          description: Failed to unassign role
          schema:
            $ref: '#/definitions/role.ErrorRoleResponse'
      security:
      - BearerAuth: []
      summary: Remove role from a user
      tags:
      - Admin
  /comments:
    get:
      consumes:
      - application/json
      description: Get list of comments with optional search, filters, and pagination
      parameters:
      - description: Search query
        in: query
        name: search
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/comment.CommentsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
      summary: List comments
      tags:
      - Comment
  /comments/{commentID}:
    delete:
      consumes:
      - application/json
      description: Soft delete a comment by ID
      parameters:
      - description: Comment ID
        in: path
        name: commentID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a comment
      tags:
      - Comment
    get:
      consumes:
      - application/json
      description: Get comment details by commentID
      parameters:
      - description: Comment ID
        in: path
        name: commentID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/comment.CommentResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
      summary: Get a comment by ID
      tags:
      - Comment
    put:
      consumes:
      - application/json
      description: Update an existing comment by ID
      parameters:
      - description: Comment ID
        in: path
        name: commentID
        required: true
        type: integer
      - description: Comment payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/comment.CommentSwagger'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/comment.CommentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a comment
      tags:
      - Comment
  /comments/posts/{postID}:
    get:
      consumes:
      - application/json
      description: Get list of comments for a specific post
      parameters:
      - description: Post ID
        in: path
        name: postID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/comment.CommentsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
      summary: List comments for a post
      tags:
      - Comment
    post:
      consumes:
      - application/json
      description: Create a new comment for a post
      parameters:
      - description: Post ID
        in: path
        name: postID
        required: true
        type: integer
      - description: Comment payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/comment.CommentSwagger'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/comment.CommentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/comment.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a comment
      tags:
      - Comment
  /posts:
    get:
      consumes:
      - application/json
      description: Get list of posts with optional search, filters, and pagination
      parameters:
      - description: Search query
        in: query
        name: search
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/post.PostsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/post.ErrorResponse'
      summary: List posts
      tags:
      - Post
  /posts/{postID}:
    get:
      consumes:
      - application/json
      description: Get post details by postID
      parameters:
      - description: Post ID
        in: path
        name: postID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/post.PostResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/post.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/post.ErrorResponse'
      summary: Get a post by ID
      tags:
      - Post
  /register:
    post:
      consumes:
      - application/json
      description: Create a new user in the system
      parameters:
      - description: Register request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.DtoRegister'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            $ref: '#/definitions/auth.DtoRegisterResponse'
        "400":
          description: Invalid request payload
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - Auth
  /signin:
    post:
      consumes:
      - application/json
      description: Authenticate user with username and password, returns JWT token
      parameters:
      - description: Login request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.DtoSignIn'
      produces:
      - application/json
      responses:
        "200":
          description: JWT token returned
          schema:
            $ref: '#/definitions/auth.DtoSignInResponse'
        "400":
          description: Invalid request payload
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid password
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: User login
      tags:
      - Auth
  /users:
    post:
      consumes:
      - application/json
      description: Create a new user in the system
      parameters:
      - description: User data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.User'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: Invalid request payload
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new user
      tags:
      - User
  /users/{userId}:
    delete:
      description: Delete a user by ID
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid user ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - User
    put:
      consumes:
      - application/json
      description: Update fields of a user
      parameters:
      - description: User ID
        in: path
        name: userId
        type: integer
      - description: Updated user fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.User'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: Invalid request payload
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update user
      tags:
      - User
  /users/me:
    get:
      description: Get logged-in user info based on JWT token
      produces:
      - application/json
      responses:
        "200":
          description: Current user info
          schema:
            $ref: '#/definitions/user.Public'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/post.UnauthorizedResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/post.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - User
  /writter/posts:
    post:
      consumes:
      - application/json
      description: Create a new post
      parameters:
      - description: Post payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/post.PostSwagger'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/post.PostResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/post.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/post.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a post
      tags:
      - Post
  /writter/posts/{postID}:
    delete:
      consumes:
      - application/json
      description: Soft delete a post by ID
      parameters:
      - description: Post ID
        in: path
        name: postID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/post.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/post.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/post.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a post
      tags:
      - Post
    put:
      consumes:
      - application/json
      description: Update an existing post by ID
      parameters:
      - description: Post ID
        in: path
        name: postID
        required: true
        type: integer
      - description: Post payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/post.PostSwagger'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/post.PostResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/post.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/post.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a post
      tags:
      - Post
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
